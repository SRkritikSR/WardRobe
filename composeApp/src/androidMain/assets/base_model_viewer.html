<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Fashion You Up</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>

    <!-- Three.js UMD -->
    <script src="https://unpkg.com/three@0.135.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xeeeeee); // light gray
    document.body.appendChild(renderer.domElement);
    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0); // Optional, center point
    controls.update();
    // 💡 Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    const loader = new THREE.GLTFLoader();


    // 🔽 Load the model
    window.loadModel = function (glbUrl) {
        loader.load(glbUrl, function (gltf) {
    const model = gltf.scene;

    // Compute bounding box
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());

    // Shift model so it's centered at origin
    model.position.sub(center);

    // Add model to scene
    scene.add(model);

    // Update controls and camera
    controls.target.set(0, 0, 0);
    controls.update();

    const size = box.getSize(new THREE.Vector3()).length();
    camera.position.set(0, 0, size * 1.5);
    camera.lookAt(0, 0, 0);
});
    };
<!--    loadModel("http://127.0.0.1:8000/models/sample_mannequin.glb")-->
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

</script>
</body>
</html>
