<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Moving Space Background</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>

    <!-- Three.js UMD -->
    <script src="https://unpkg.com/three@0.135.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();

    // 🌌 Create a large sphere with inside-facing space texture
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load('https://images.pexels.com/photos/17662493/pexels-photo-17662493.jpeg', function (texture) {
      const geometry = new THREE.SphereGeometry(100, 64, 64);
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });
      const spaceSphere = new THREE.Mesh(geometry, material);
      scene.add(spaceSphere);

      // Store for animation
      animate.spaceSphere = spaceSphere;
    });

    // 💡 Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // 🧍 Load the astronaut
    const loader = new THREE.GLTFLoader();
    loader.load('https://modelviewer.dev/shared-assets/models/Astronaut.glb', function (gltf) {
      scene.add(gltf.scene);
    }, undefined, function (error) {
      console.error("The error is given by",error);
    });
    console.log("Loader is present",loader)
    // 🌀 Animate the space sphere to create motion
    function animate() {
      requestAnimationFrame(animate);
      if (animate.spaceSphere) {
        animate.spaceSphere.rotation.y += 0.0005;  // Slow rotation
      }
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
